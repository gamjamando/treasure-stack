<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treasure Stack MVP - Fever Frenzy Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 h-[100dvh] w-full flex flex-col justify-between select-none overflow-hidden">

    <div id="game-screen" class="relative flex-1 w-full h-[100dvh] flex flex-col items-center pt-2 transition-transform bg-white shadow-inner overflow-hidden screen">
        <div id="danger-overlay" class="absolute inset-0 pointer-events-none z-0"></div>
        <div id="flash-overlay" class="absolute inset-0 pointer-events-none z-50"></div> 
        
        <div id="fever-flash"></div>
        <button id="btn-game-menu" class="absolute top-4 right-4 z-40 w-10 h-10 rounded-xl bg-slate-800/70 text-white font-black">
    ☰
</button>

<div id="game-menu-modal" class="hidden absolute inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center">
    <div class="bg-white rounded-3xl p-6 w-72 text-center shadow-2xl">
        <h2 class="text-xl font-black mb-4">MENU</h2>
        <button id="btn-retry" class="w-full py-3 mb-3 bg-blue-600 text-white rounded-xl font-black">다시하기</button>
        <button id="btn-home" class="w-full py-3 mb-3 bg-slate-700 text-white rounded-xl font-black">홈으로</button>
        <button id="btn-resume" class="w-full py-3 bg-slate-200 text-slate-800 rounded-xl font-black">계속하기</button>
    </div>
</div>

        <div class="w-full px-6 pt-4 flex justify-between items-center z-20">
            <div class="flex flex-col">
                <span class="text-slate-400 font-bold text-xs tracking-wider" id="hud-title-mode">TIME</span>
                <span id="hud-time" class="text-2xl font-black text-blue-600">남은 시간: 30.00초</span>
                <div id="hud-hearts" class="heart-hud hidden" aria-label="라이프"></div>
            </div>
            <div class="flex flex-col items-center select-none" id="score-zone">
                <span class="text-slate-400 font-bold text-xs tracking-wider">SCORE</span>
                <span id="hud-score" class="text-3xl font-black text-slate-900 transition-all inline-block">점수: 0</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-slate-400 font-bold text-xs tracking-wider">COMBO</span>
                <span id="hud-combo" class="text-2xl font-black text-emerald-500 inline-block">콤보: 0</span>
            </div>
        </div>

        <div class="text-xs text-slate-400 font-bold mt-1 z-20">BEST: <span id="hud-best">0</span></div>

        <div class="w-11/12 h-3.5 bg-slate-200 rounded-full mt-2 border border-slate-300 overflow-hidden z-20 shadow-inner" id="fever-gap">
            <div id="fever-bar" class="h-full bg-gradient-to-r from-emerald-400 to-blue-500 transition-all duration-100" style="width: 0%;"></div>
        </div>
        
        <div id="overload-warning" class="text-rose-600 font-black text-xl mt-1 opacity-0 transition-opacity z-20 hidden animate-pulse">⚠️ 레일 오버로드 위험! 빨리 처리하세요! ⚠️</div>

        <div id="track" class="relative w-full flex-1 z-10 pointer-events-none mt-2 mb-4">

            <!-- 컨베이어 벨트 -->
            <div id="belt-area">
                <div class="belt"></div>
            </div>
        
            <!-- 아이템 레이어 -->
            <div id="item-stack" class="relative w-full h-full z-20"></div>
        
            <!-- 점수 이펙트 -->
            <div id="float-layer" class="absolute inset-0 pointer-events-none z-40"></div>
        
        </div>
    </div>

    <div class="w-full h-36 flex z-30 shadow-[0_-8px_24px_rgba(0,0,0,0.05)] bg-white border-t border-slate-200 shrink-0">
        <button id="btn-left" class="flex-1 bg-slate-50 border-r border-slate-200 flex flex-col justify-center items-center transition-all">
            <span class="text-3xl mb-1">◀️</span>
            <span class="text-slate-500 font-black text-base">버리기 (A)</span>
        </button>
        <button id="btn-right" class="flex-1 bg-blue-500 flex flex-col justify-center items-center transition-all">
            <span class="text-3xl mb-1">▶️</span>
            <span class="text-white font-black text-base">챙기기 (D)</span>
        </button>
    </div>

    <div id="start-screen" class="absolute inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center p-6 overflow-y-auto">
        <h1 class="text-5xl font-black tracking-tight text-blue-600 mb-2 text-center leading-tight">TREASURE<br>STACK</h1>
        <p class="text-slate-500 mb-6 text-center font-medium text-sm leading-relaxed">
            왼쪽 버리기: 석탄(waste), 다이너마이트(bomb)<br>오른쪽 챙기기: 코인(treasure) & 모래시계(time)
        </p>
        
        <div class="space-y-4 w-full max-w-xs flex flex-col items-center pb-6">
            <button id="btn-start-classic" class="w-full py-4 bg-blue-600 text-white text-xl font-black rounded-2xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all tracking-wider flex flex-col items-center">
                <span>CLASSIC MODE</span>
                <span class="text-[11px] font-normal text-blue-200 mt-0.5">30초 동안 실시간 최고 점수 타임어택 경쟁</span>
            </button>
            
            <button id="btn-start-challenge" class="w-full py-4 bg-emerald-600 text-white text-xl font-black rounded-2xl shadow-lg hover:bg-emerald-700 active:scale-95 transition-all tracking-wider flex flex-col items-center">
                <span>CHALLENGE MODE</span>
                <span class="text-[11px] font-normal text-emerald-200 mt-0.5">라이프 3개! 자동으로 차오르는 스택 생존전</span>
            </button>

            <button id="btn-rank-view" class="w-full py-3 bg-slate-700 text-white text-base font-bold rounded-xl shadow hover:bg-slate-600 active:scale-95 transition-all flex items-center justify-center gap-2 mt-2">
                <span>🏆</span> 글로벌 실시간 점수판
            </button>
        </div>
    </div>

    <div id="ranking-screen" class="hidden absolute inset-0 bg-slate-950 z-[60] flex flex-col p-5 overflow-hidden">
        <div class="flex items-center justify-between shrink-0 mb-4">
            <button id="btn-rank-back" class="w-12 h-12 rounded-xl bg-slate-800 text-white text-2xl font-black active:scale-95 transition-all">←</button>
            <div class="text-center">
                <p class="text-yellow-300 text-xs font-black tracking-[0.25em]">TREASURE STACK</p>
                <h2 class="text-white text-3xl font-black leading-tight">GLOBAL RANKING</h2>
            </div>
            <div class="w-12 h-12"></div>
        </div>

        <div id="ranking-page-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <div id="result-screen" class="hidden absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-6 overflow-y-auto">
        <div class="bg-white p-6 rounded-3xl border border-slate-200 w-full max-w-sm text-center shadow-2xl transform transition-all max-h-[92vh] overflow-y-auto">
            <h1 id="result-title" class="text-3xl font-black text-blue-600 mb-6 tracking-tight">TIME OVER ⏱️</h1>
            
            <p class="text-slate-400 text-xs font-bold mb-1 tracking-widest">BEST SCORE</p>
            <p id="res-best" class="text-3xl font-black text-blue-600 mb-4">0</p>
            
            <div class="w-full h-px bg-slate-100 mb-4"></div>

            <div class="space-y-3 text-left px-2 mb-6 text-sm">
                <div class="flex justify-between items-center"><span class="text-slate-500 font-medium">선택 모드</span><span id="res-mode-label" class="text-base font-black text-slate-800">CLASSIC</span></div>
                <div class="flex justify-between items-center"><span class="text-slate-500 font-medium">획득 점수</span><span id="res-score" class="text-xl font-black text-slate-900">0</span></div>
                <div class="flex justify-between items-center"><span class="text-slate-500 font-medium">플레이 시간</span><span id="res-time" class="text-lg font-bold text-slate-700">00:00</span></div>
                <div class="flex justify-between items-center"><span class="text-slate-500 font-medium">최대 콤보</span><span id="res-combo" class="text-lg font-bold text-emerald-500">0</span></div>
            </div>

            <div id="ranking-box-anchor" class="w-full"></div>

            <button id="btn-again" class="w-full py-4 bg-blue-600 text-white text-lg font-black rounded-xl hover:bg-blue-700 active:scale-95 transition-all mt-4">메인 화면으로</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
